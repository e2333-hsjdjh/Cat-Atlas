name: Test and deploy Cat Atlas

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cat-atlas-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_BASE_PATH: /cat
      NEXT_PUBLIC_API_MODE: django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m pip wheel --wheel-dir backend/wheels -r backend/requirements.txt
      - run: npm prune --omit=dev
      - name: Package
        run: |
          tar --exclude='backend/data' --exclude='backend/media' --exclude='backend/.venv' \
            -czf cat-atlas-${GITHUB_SHA}.tar.gz \
            package.json package-lock.json node_modules .next public next.config.ts backend
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="cat-atlas-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/deploy_key "$archive" "${USER}@${HOST}:/tmp/$archive"
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "sudo /usr/local/sbin/deploy-cat-atlas '/tmp/$archive' '$GITHUB_SHA'"
