    # ===== 猫猫图鉴（独立服务：3180 / 3181）=====
    location = /cat { return 301 /cat/; }
    location = /cat/admin { return 301 /cat/admin/; }

    location ^~ /cat/admin/ {
        proxy_pass http://127.0.0.1:3181/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /cat;
        client_max_body_size 20m;
    }

    location ^~ /cat/api/ {
        proxy_pass http://127.0.0.1:3181/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /cat;
        client_max_body_size 20m;
    }

    location ^~ /cat/static/ {
        alias /www/wwwroot/cat-atlas/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location ^~ /cat/media/ {
        alias /www/wwwroot/cat-atlas/backend/media/;
        expires 7d;
        access_log off;
    }

    location ^~ /cat/ {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    # ===== /猫猫图鉴 =====
